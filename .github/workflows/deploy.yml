name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master # Dispara o workflow em todo push para a branch master

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }} # Evita execuções simultâneas concorrentes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies 📦
        run: npm ci

      - name: Build 🚀
        run: npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out # Pasta gerada pelo build estático do Next.js (output: 'export')
          branch: gh-pages # Branch onde os arquivos estáticos serão servidos pelo GitHub Pages
          clean: true # Remove arquivos antigos da branch de deploy que não estão no build novo
